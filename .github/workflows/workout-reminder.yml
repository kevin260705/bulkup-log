name: workout-reminder
# 알림: 매일 08시부터 자정까지 2시간마다 (KST). 자정 이후~08시에는 보내지 않는다.
# 깃허브 예약은 몇 시간씩 건너뛰어서, 실행 하나가 다음 알림까지 기다렸다 보내고
# 끝나기 전에 다음 실행을 직접 이어 붙인다(이어달리기). 예약은 끊겼을 때 다시 살리는 용도.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode: { description: 'test = 무작위 문장 1개 바로 발송, chain = 이어달리기', default: 'test' }
      parent: { description: '이어 준 이전 실행 ID', default: '' }
permissions:
  actions: write
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save web-push
      - run: node .github/push/send.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'chain' }}
          PARENT: ${{ inputs.parent }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
