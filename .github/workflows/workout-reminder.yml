name: workout-reminder
# 알림: 매일 08 · 10 · 12 · 14 · 16 · 18 · 20시 (KST). 22시~08시에는 보내지 않는다.
# 깃허브 예약은 늦거나 건너뛸 때가 많아서 20분마다 깨우고,
# 다음 알림 시각을 먼저 맡은(태그로 잠근) 실행 하나만 정각까지 기다렸다가 보낸다.
on:
  schedule:
    - cron: '*/20 21-23,0-11 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save web-push
      - run: node .github/push/send.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
