// ---------- 차트 (단일 계열 · 1축 · 탭하면 툴팁) ----------
const charts={};
function fmtN(v,dec){return (+v).toFixed(dec).replace(/\.0+$/,'');}
function md(iso){return (+iso.slice(5,7))+'/'+(+iso.slice(8));}
function niceMax(m){const e=Math.pow(10,Math.floor(Math.log10(m)));const f=m/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e;}
function fmtK(v){return v>=1000?(v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,'')+'k':String(Math.round(v));}
function lineChart(id,pts,unit,dec){
  const W=340,H=170,L=38,R=16,T=24,B=26;
  const xs=pts.map(p=>dnum(p.d));let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=1;x1+=1;}
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const pad=Math.max((hi-lo)*.2,Math.abs(hi)*.01,.5);lo-=pad;hi+=pad;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const P=pts.map((p,i)=>({x:X(xs[i]),y:Y(p.v),d:p.d,v:p.v}));
  const grid=[.1,.5,.9].map(t=>lo+(hi-lo)*t).map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtN(v,dec)}</text>`).join('');
  const ends=P.length===1?[P[0]]:[P[0],P[P.length-1]];
  const xl=ends.map((p,i)=>`<text class="axis" x="${p.x.toFixed(1)}" y="${H-7}" text-anchor="${ends.length===1?'middle':i?'end':'start'}">${md(p.d)}</text>`).join('');
  const line=P.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join('');
  const last=P[P.length-1];
  charts[id]={P,unit,dec,W,H};
  return `<div class="chart" data-id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${id} 추이">
    <defs><linearGradient id="g_${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:hsl(var(--chart));stop-opacity:.25"/><stop offset="1" style="stop-color:hsl(var(--chart));stop-opacity:0"/></linearGradient></defs>
    ${grid}${xl}
    ${P.length>1?`<path d="${line}L${last.x.toFixed(1)} ${H-B}L${P[0].x.toFixed(1)} ${H-B}Z" fill="url(#g_${id})"/><path class="ln" d="${line}"/>`:''}
    ${P.map(p=>`<circle class="pt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"/>`).join('')}
    <text class="lbl" x="${last.x.toFixed(1)}" y="${(last.y-11).toFixed(1)}" text-anchor="${P.length>1?'end':'middle'}">${fmtN(last.v,dec)}${unit}</text>
    <g class="cross" style="display:none"><line x1="0" x2="0" y1="${T-8}" y2="${H-B}"/><circle cx="0" r="5"/></g>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  </svg><div class="tip" hidden></div></div>`;
}
function barChart(id,bars){
  const W=340,H=170,L=38,R=10,T=24,B=26,base=H-B;
  const nice=niceMax(Math.max(...bars.map(b=>b.v),1)),slot=(W-L-R)/bars.length,bw=slot*.62;
  const Y=v=>T+(1-v/nice)*(H-T-B);
  const grid=[0,.5,1].map(t=>nice*t).map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`).join('');
  const P=bars.map((b,i)=>({x:L+slot*i+slot/2,y:b.v?Y(b.v):base,lab:b.lab,sub:b.sub,v:b.v,label:b.label}));
  const rects=P.map(p=>{if(!p.v)return '';const x=p.x-bw/2,y=p.y,r=Math.min(4,bw/2,base-y);return `<path class="bar${p===P[P.length-1]?' cur':''}" d="M${x.toFixed(1)} ${base}V${(y+r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x+r).toFixed(1)} ${y.toFixed(1)}H${(x+bw-r).toFixed(1)}Q${(x+bw).toFixed(1)} ${y.toFixed(1)} ${(x+bw).toFixed(1)} ${(y+r).toFixed(1)}V${base}Z"/>`;}).join('');
  const xl=P.map((p,i)=>i%2===bars.length%2?'':`<text class="axis" x="${p.x.toFixed(1)}" y="${H-7}" text-anchor="middle">${p.label}</text>`).join('');
  const last=P[P.length-1];
  charts[id]={P,unit:'',dec:0,W,H};
  return `<div class="chart" data-id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 운동 볼륨">
    ${grid}${rects}${xl}
    ${last.v?`<text class="lbl" x="${last.x.toFixed(1)}" y="${(last.y-7).toFixed(1)}" text-anchor="middle">${fmtK(last.v)}</text>`:''}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  </svg><div class="tip" hidden></div></div>`;
}
let chartDocBound=false;
function bindCharts(){
  document.querySelectorAll('.chart').forEach(el=>{
    const c=charts[el.dataset.id];if(!c)return;
    const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),cr=svg.querySelector('.cross');
    const show=e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*c.W;let b=c.P[0];for(const p of c.P)if(Math.abs(p.x-sx)<Math.abs(b.x-sx))b=p;
      if(cr){cr.style.display='';cr.setAttribute('transform',`translate(${b.x} 0)`);cr.querySelector('circle').setAttribute('cy',b.y);}
      tip.hidden=false;tip.innerHTML=`<b>${b.lab||fmtN(b.v,c.dec)+c.unit}</b>${b.sub||dayLabel(b.d)}`;
      tip.style.left=Math.min(Math.max(b.x/c.W*r.width,60),r.width-60)+'px';tip.style.top=(b.y/c.H*r.height)+'px';};
    svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);
    svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){tip.hidden=true;if(cr)cr.style.display='none';}});
  });
  if(!chartDocBound){chartDocBound=true;document.addEventListener('pointerdown',e=>{if(!e.target.closest||!e.target.closest('.chart'))document.querySelectorAll('.chart').forEach(el=>{el.querySelector('.tip').hidden=true;const cr=el.querySelector('.cross');if(cr)cr.style.display='none';});});}
}
function weeklyVolume(n){
  const t=dnum(today()),w0=t-((new Date().getDay()+6)%7),out=[];
  for(let i=n-1;i>=0;i--){const s0=w0-7*i;let v=0,c=0;
    Object.keys(store.logs).forEach(d=>{const x=dnum(d);if(x>=s0&&x<s0+7&&isDone(store.logs[d])){v+=volume(store.logs[d]);c++;}});
    const sd=new Date(s0*864e5),label=(sd.getUTCMonth()+1)+'/'+sd.getUTCDate();
    out.push({label,v,lab:Math.round(v).toLocaleString()+'kg',sub:`${label} 주 · ${c}회 운동${i===0?' (이번 주)':''}`});}
  return out;
}

// ---------- 데이터 화면 ----------
function tileHTML(k,label,unit,good){
  const b=bodySorted().filter(x=>x[k]!=null);
  if(!b.length) return `<div class="tile"><span>${label}</span><b>–</b><div class="delta">기록 없음</div></div>`;
  const l=b[b.length-1],d=l[k]-b[0][k],dir=Math.abs(d)<0.05?0:Math.sign(d),cls=!dir||!good?'':(dir===good?'good':'bad');
  return `<div class="tile"><span>${label}</span><b>${fmtN(l[k],1)}<small>${unit}</small></b><div class="delta ${cls}">${b.length<2?'첫 측정':(dir>0?'▲ ':dir<0?'▼ ':'– ')+fmtN(Math.abs(d),1)+unit}</div></div>`;
}
function renderData(){
  const n=nutrition(),g=store.profile.goal,gw=g==='cut'?-1:g==='keep'?0:1,bs=bodySorted();
  const series=k=>bs.filter(x=>x[k]!=null).map(x=>({d:x.date,v:x[k]}));
  const chartCard=(k,title,unit)=>{const pts=series(k);
    return `<div class="card"><div class="ch-head"><h3>${title}</h3><span class="muted">${pts.length?pts.length+'회 측정 · '+unit:''}</span></div>
      ${pts.length?lineChart(k,pts,unit,1):'<div class="empty">인바디를 입력하면 그래프가 그려져요</div>'}
      ${pts.length?`<details class="tbl"><summary>표로 보기</summary><table>${pts.slice().reverse().map(p=>`<tr><td>${dayLabel(p.d)}</td><td style="text-align:right">${fmtN(p.v,1)}${unit}</td></tr>`).join('')}</table></details>`:''}</div>`;};
  const prs={};
  Object.keys(store.logs).forEach(d=>Object.entries(store.logs[d].ex).forEach(([nm,e])=>e.sets.forEach(x=>{if(x&&x.d&&x.w&&x.r){const e1=x.w*(1+x.r/30);if(!prs[nm]||e1>prs[nm].e1)prs[nm]={e1,w:x.w,r:x.r,d};}})));
  const prList=Object.entries(prs).sort((a,b)=>b[1].e1-a[1].e1).slice(0,10).map(([nm,x])=>`<div class="prrow"><span>${nm}<small>${dayLabel(x.d)}</small></span><b>${x.w}kg × ${x.r}<small>추정 1RM ${Math.round(x.e1)}kg</small></b></div>`).join('');
  const pct=v=>Math.round(v/n.kcal*100);
  return `<div class="page-title"><h2>데이터</h2><button class="btn tint small" onclick="toggleBodyForm()">${bodyFormOpen?'입력 닫기':'+ 인바디 입력'}</button></div>
  ${bodyFormOpen?renderBodyForm():''}
  ${!bodyFormOpen&&bs.length?`<div class="latest"><span>마지막 측정 ${dayLabel(bs[bs.length-1].date)}</span><span>${bs.length}회 기록</span></div>`:''}
  <section class="card nutri"><div class="k2">하루 목표 섭취량 · ${n.G.l}</div>
    <div class="hero"><b>${n.kcal.toLocaleString()}</b><span>kcal</span></div>
    <div class="macros"><div><span>단백질</span><b>${n.p}g</b><em>${pct(n.p*4)}%</em></div><div><span>탄수화물</span><b>${n.c}g</b><em>${pct(n.c*4)}%</em></div><div><span>지방</span><b>${n.f}g</b><em>${pct(n.f*9)}%</em></div></div>
    <div class="muted calc">기초대사량 ${n.bmr.toLocaleString()}kcal (${n.src}) × 활동량 ${n.A.f} = 유지 ${n.tdee.toLocaleString()}kcal, 목표 ${n.G.k>=0?'+':''}${n.G.k}kcal<br>단백질 체중 ${fmtN(n.w,1)}kg × ${n.G.p}g · 지방 25% · 나머지 탄수화물</div>
    ${adviceHTML(n)}
  </section>
  <div class="set-sec">신체 변화 · 처음 측정 대비</div>
  <div class="tiles">${tileHTML('w','체중','kg',gw)}${tileHTML('smm','골격근량','kg',1)}${tileHTML('bf','체지방률','%',-1)}</div>
  ${chartCard('w','체중','kg')}${chartCard('smm','골격근량','kg')}${chartCard('bf','체지방률','%')}
  <div class="card"><div class="ch-head"><h3>주간 운동 볼륨</h3><span class="muted">최근 8주 · kg</span></div>${barChart('vol',weeklyVolume(8))}</div>
  <div class="card"><h3>종목별 최고 기록</h3>${prList||'<div class="empty">세트를 완료하면 기록이 쌓여요</div>'}</div>
  ${bs.length?`<div class="card blist"><h3>측정 기록</h3><div class="row h"><span>날짜</span><span>체중</span><span>골격근</span><span>체지방</span><span></span></div>${bs.slice().reverse().map(b=>`<div class="row"><span>${dayLabel(b.date)}</span><span>${b.w!=null?fmtN(b.w,1)+'kg':'–'}</span><span>${b.smm!=null?fmtN(b.smm,1)+'kg':'–'}</span><span>${b.bf!=null?fmtN(b.bf,1)+'%':'–'}</span><button class="x" onclick="delBody('${b.date}')" aria-label="삭제">✕</button></div>`).join('')}</div>`:''}`;
}

// ---------- 설정 (마이페이지) ----------
function setProfile(k,v,re){store.profile[k]=['age','height'].includes(k)?(v===''?null:Number(v)):v;save();if(re)render();else{flashSaved();renderNav();}}
function setTheme(t){store.theme=t;save();applyTheme();render();}
function resetAll(){if(!confirm('모든 운동·인바디 기록을 삭제할까요?'))return;if(!confirm('되돌릴 수 없어요. 정말 삭제할까요?'))return;localStorage.removeItem(KEY);location.reload();}

    moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
    up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',

  const C={blue:'n',cyan:'n',violet:'n',green:'n',orange:'n',gray:'n',pink:'n',red:'r'};

  const dark=(store.theme||'dark')==='dark';
  return `<div class="page-title"><h2>설정</h2></div>
  <div class="card prof"><div class="avatar big">${((pr.name||'?').trim()[0]||'?').toUpperCase()}</div><div><input class="name-in" value="${(pr.name||'').replace(/"/g,'&quot;')}" placeholder="닉네임" maxlength="20" oninput="setProfile('name',this.value)"><div class="muted" style="margin-top:6px">이 기기에 저장되는 내 프로필</div></div></div>

  <div class="set-sec">신체 정보</div>
  <div class="card glist">

// ---------- 렌더 ----------
let lastKey='';
function persistUI(){store.ui=Object.assign(store.ui||{},{tab:curTab,date:curDate,view,t:Date.now()});persist();}
function render(){
  if(!curTab||!PROGRAM.some(p=>p.id===curTab)) curTab=suggestDay();
  persistUI();
  document.body.dataset.view=view;
  renderNav();renderWeek();
  const m=document.getElementById('main');
  if(view==='cal') m.innerHTML=renderCal();
  else if(view==='data'){m.innerHTML=renderData();bindCharts();}
  else if(view==='set') m.innerHTML=renderSettings();
  else if(view==='guide') m.innerHTML=`<button class="btn ghost small back" onclick="setView('set')">‹ 설정</button>`+renderInfo();
  else{renderTabs();m.innerHTML=renderDay(PROGRAM.find(d=>d.id===curTab));centerTab();}
  const key=view+'|'+curTab+'|'+curDate;
  if(key!==lastKey){window.scrollTo(0,0);lastKey=key;}
}
// 앱 전환 후 돌아오면: 보던 화면·날짜·스크롤·타이머 그대로 복원 (6시간 이내)
(function restore(){
  const u=store.ui;
  if(u&&Date.now()-u.t<6*3600e3){curTab=u.tab||null;curDate=u.date||today();view=['home','cal','data','set','guide'].includes(u.view)?u.view:'home';}
  render();
  if(u&&Date.now()-u.t<6*3600e3&&u.y) setTimeout(()=>window.scrollTo(0,u.y),0);
  if(store.timerEnd&&store.timerEnd>Date.now()){tEnd=store.timerEnd;runTimer();}
})();
function saveNow(){if(store.ui){store.ui.y=window.scrollY;store.ui.t=Date.now();}persist();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();else if(tEnd)tick();});
window.addEventListener('pagehide',saveNow);
</script>
