<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>상체 벌크업 루틴 · 기록장</title>
<meta name="description" content="상체 벌크업 5분할 루틴 기록장: 세트별 기록, 증량 추천, 휴식 타이머, 황철순 운동 영상">
<meta property="og:title" content="Bulkup Log">
<meta property="og:description" content="상체 벌크업 5분할 루틴 기록장">
<meta property="og:image" content="https://d2ol7oe51mr4n9.cloudfront.net/user_39Bv7Twf1ididBYxsmBgq7k5JAA/d42221b3-8043-477c-a727-9200cc626abb.png">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="벌크업 루틴">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  /* ---- shadcn/ui tokens (zinc) ---- */
  :root{
    --background:240 10% 3.9%;--foreground:0 0% 98%;
    --card:240 10% 3.9%;--card-foreground:0 0% 98%;
    --primary:0 0% 98%;--primary-foreground:240 5.9% 10%;
    --secondary:240 3.7% 15.9%;--secondary-foreground:0 0% 98%;
    --muted:240 3.7% 15.9%;--muted-foreground:240 5% 64.9%;
    --accent:240 3.7% 15.9%;--accent-foreground:0 0% 98%;
    --destructive:0 62.8% 50%;--destructive-foreground:0 0% 98%;
    --border:240 3.7% 15.9%;--input:240 3.7% 15.9%;--ring:240 4.9% 83.9%;
    --success:142 71% 45%;--warning:38 92% 50%;--info:217 91% 60%;
    --radius:.5rem;
  }
  html[data-theme=light]{
    --background:0 0% 100%;--foreground:240 10% 3.9%;
    --card:0 0% 100%;--card-foreground:240 10% 3.9%;
    --primary:240 5.9% 10%;--primary-foreground:0 0% 98%;
    --secondary:240 4.8% 95.9%;--secondary-foreground:240 5.9% 10%;
    --muted:240 4.8% 95.9%;--muted-foreground:240 3.8% 46.1%;
    --accent:240 4.8% 95.9%;--accent-foreground:240 5.9% 10%;
    --destructive:0 84.2% 60.2%;
    --border:240 5.9% 90%;--input:240 5.9% 90%;--ring:240 5.9% 10%;
    --success:142 76% 36%;--warning:32 95% 44%;--info:221 83% 53%;
  }
  *{box-sizing:border-box;border-color:hsl(var(--border))}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:"Pretendard Variable",Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
  a{color:hsl(var(--foreground));text-underline-offset:3px}
  ::selection{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}

  /* header */
  header{position:sticky;top:0;z-index:10;background:hsl(var(--background)/.92);backdrop-filter:blur(10px);border-bottom:1px solid hsl(var(--border))}
  .hwrap{max-width:760px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  header .meta{font-size:12px;color:hsl(var(--muted-foreground));margin-top:2px}
  .hright{display:flex;align-items:center;gap:8px}

  /* tabs (shadcn TabsList / TabsTrigger) */
  .tabs-wrap{max-width:760px;margin:0 auto;padding:12px 16px 0}
  .tabs{display:inline-flex;max-width:100%;height:40px;align-items:center;gap:2px;border-radius:calc(var(--radius) + 2px);background:hsl(var(--muted));padding:4px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:calc(var(--radius) - 2px);font-size:13px;font-weight:500;color:hsl(var(--muted-foreground));cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none}
  .tab.active{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:0 1px 2px rgba(0,0,0,.25)}
  html[data-theme=light] .tab.active{box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}

  main{padding:12px 16px 96px;max-width:760px;margin:0 auto}

  /* card */
  .card{background:hsl(var(--card));color:hsl(var(--card-foreground));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h3 .idx{color:hsl(var(--muted-foreground));font-weight:400;font-size:12px}
  .card.current{border-color:hsl(var(--ring));box-shadow:0 0 0 1px hsl(var(--ring)),0 1px 2px rgba(0,0,0,.05)}
  .cur-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:hsl(var(--success))}
  .cur-badge:before{content:"";width:6px;height:6px;border-radius:50%;background:hsl(var(--success));box-shadow:0 0 0 3px hsl(var(--success)/.25)}

  .target{font-size:12px;color:hsl(var(--muted-foreground));display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 10px}
  .target b{color:hsl(var(--foreground));font-weight:600}

  /* alert / note */
  .note{position:relative;font-size:13px;color:hsl(var(--foreground));background:hsl(var(--muted)/.5);border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);padding:8px 10px 8px 30px;margin:8px 0}
  .note:before{content:"";position:absolute;left:10px;top:10px;width:12px;height:12px;border-radius:50%;border:1.5px solid hsl(var(--muted-foreground))}
  .note:after{content:"i";position:absolute;left:10px;top:9px;width:12px;text-align:center;font-size:9px;font-weight:700;color:hsl(var(--muted-foreground))}

  .last{font-size:12px;color:hsl(var(--muted-foreground));margin:8px 0}
  .last b{color:hsl(var(--foreground));font-weight:500}
  .last .hint{color:hsl(var(--success));font-weight:600}
  .last .hint.warn{color:hsl(var(--warning))}
  .last .hint.keep{color:hsl(var(--muted-foreground));font-weight:500}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{height:32px;padding:0 4px;text-align:center;color:hsl(var(--muted-foreground));font-weight:500;font-size:11px;letter-spacing:.02em;border-bottom:1px solid hsl(var(--border))}
  td{padding:6px 4px;text-align:center;border-bottom:1px solid hsl(var(--border))}
  tr:last-child td{border-bottom:none}
  td:first-child{color:hsl(var(--muted-foreground));font-size:12px;width:36px}
  .row-done td{opacity:.5}

  /* input */
  input[type=number]{width:100%;max-width:84px;height:36px;padding:0 8px;border-radius:calc(var(--radius) - 2px);border:1px solid hsl(var(--input));background:transparent;color:hsl(var(--foreground));font:inherit;font-size:14px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s,border-color .15s;-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 1px hsl(var(--ring))}
  input[type=number]::placeholder{color:hsl(var(--muted-foreground)/.55)}
  input[type=date].date-in{height:32px;padding:0 10px;border-radius:calc(var(--radius) - 2px);border:1px solid hsl(var(--input));background:transparent;color:hsl(var(--foreground));font:inherit;font-size:13px;color-scheme:dark}
  html[data-theme=light] input[type=date].date-in{color-scheme:light}
  textarea{width:100%;min-height:60px;background:transparent;color:hsl(var(--foreground));border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);padding:8px 10px;font:inherit;font-size:13px;resize:vertical;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  textarea:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 1px hsl(var(--ring))}

  /* checkbox */
  .chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1px solid hsl(var(--primary));border-radius:4px;background:transparent;cursor:pointer;position:relative;vertical-align:middle;transition:background .12s}
  .chk:checked{background:hsl(var(--primary));border-color:hsl(var(--primary))}
  .chk:checked:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid hsl(var(--primary-foreground));border-width:0 2px 2px 0;transform:rotate(45deg)}
  .chk:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:calc(var(--radius) - 2px);border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s,color .15s,opacity .15s}
  .btn:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
  .btn.primary,.btn.ok{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:hsl(var(--primary))}
  .btn.primary:hover,.btn.ok:hover{opacity:.9;background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
  .btn.danger{border-color:transparent;background:transparent;box-shadow:none;color:hsl(var(--destructive))}
  .btn.danger:hover{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive))}
  .btn.small{height:32px;padding:0 12px;font-size:12px}
  .btn.icon{width:36px;padding:0}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* badge */
  .badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;border:1px solid hsl(var(--border));font-size:11px;font-weight:600;color:hsl(var(--foreground));background:transparent;white-space:nowrap}
  .badge.deload{border-color:hsl(var(--warning)/.5);color:hsl(var(--warning));background:hsl(var(--warning)/.1)}
  .badge.today{border-color:hsl(var(--success)/.5);color:hsl(var(--success));background:hsl(var(--success)/.1)}
  .badge.sec{background:hsl(var(--secondary));border-color:transparent;color:hsl(var(--secondary-foreground));font-weight:500}

  /* progress */
  .prog{height:8px;background:hsl(var(--primary)/.15);border-radius:9999px;overflow:hidden;margin-top:8px}
  .prog div{height:100%;background:hsl(var(--primary));border-radius:9999px;transition:width .25s}

  /* video links */
  .videos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .videos a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9999px;border:1px solid hsl(var(--border));background:transparent;color:hsl(var(--foreground));font-size:12px;font-weight:500;text-decoration:none;transition:background .15s}
  .videos a:hover{background:hsl(var(--accent))}
  .videos a:before{content:"";width:0;height:0;border-left:7px solid hsl(var(--muted-foreground));border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

  /* details / form */
  details{margin:4px 0}
  summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 4px;border-radius:calc(var(--radius) - 2px);font-size:13px;font-weight:500;color:hsl(var(--muted-foreground));user-select:none;transition:background .15s,color .15s}
  summary::-webkit-details-marker{display:none}
  summary:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
  summary:before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 4px 0 6px;transition:transform .15s}
  details[open]>summary:before{transform:rotate(45deg);margin-top:-3px}
  .fbox{border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);padding:4px 12px;margin:6px 0 10px;background:hsl(var(--muted)/.3)}
  .frow{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid hsl(var(--border));font-size:13px;line-height:1.6}
  .frow:last-child{border-bottom:none}
  .frow b{color:hsl(var(--muted-foreground));font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
  .frow.bad b{color:hsl(var(--destructive))}
  .frow.hcs b{color:hsl(var(--warning))}

  /* misc */
  .day-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;gap:8px}
  .day-title h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid hsl(var(--border));font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv span:last-child{color:hsl(var(--muted-foreground));text-align:right}
  .hist{padding:6px 0;border-bottom:1px solid hsl(var(--border));font-size:13px}
  .hist:last-child{border-bottom:none}
  .hist .d{color:hsl(var(--foreground));font-weight:600}
  .hist .v{color:hsl(var(--muted-foreground));font-size:12px;margin-left:6px}
  .hist .ex{margin:2px 0 2px 12px;color:hsl(var(--foreground)/.85);font-size:12.5px}
  .muted{color:hsl(var(--muted-foreground));font-size:12.5px}
  ul{padding-left:18px;margin:6px 0}li{margin:4px 0;font-size:13.5px}
  .research td{text-align:left;font-size:12.5px;vertical-align:top;padding:8px 6px}
  .research th{text-align:left;padding:0 6px}
  .research a{color:hsl(var(--info));text-decoration:none}
  .research a:hover{text-decoration:underline}
  .stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

  /* timer (bottom bar) */
  .timer{position:fixed;bottom:0;left:0;right:0;background:hsl(var(--background)/.92);border-top:1px solid hsl(var(--border));backdrop-filter:blur(10px);z-index:10}
  .timer .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:6px}
  .timer .t{font-size:24px;font-weight:600;letter-spacing:-.02em;min-width:74px;font-variant-numeric:tabular-nums}
  .timer .t.done{color:hsl(var(--success))}
  .timer .btn{height:32px;padding:0 10px;font-size:12px}
  .timer .sp{flex:1}

  /* theme toggle */
  .tt{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:calc(var(--radius) - 2px);border:1px solid hsl(var(--input));background:transparent;color:hsl(var(--foreground));cursor:pointer}
  .tt:hover{background:hsl(var(--accent))}
  .tt svg{width:16px;height:16px}
  .sun{display:none}.moon{display:block}
  html[data-theme=light] .sun{display:block}html[data-theme=light] .moon{display:none}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1>상체 벌크업 루틴</h1>
      <div class="meta">33세 · 182cm · 73kg · 주 5회 · 하체 1회</div>
    </div>
    <div class="hright">
      <span id="weekBadge" class="badge"></span>
      <button class="tt" onclick="toggleTheme()" aria-label="테마 전환">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
<main id="main"></main>

<div class="timer"><div class="in">
  <div class="t" id="timerText">0:00</div>
  <button class="btn" onclick="startTimer(60)">60s</button>
  <button class="btn" onclick="startTimer(90)">90s</button>
  <button class="btn" onclick="startTimer(120)">2분</button>
  <button class="btn" onclick="startTimer(180)">3분</button>
  <span class="sp"></span>
  <button class="btn ghost" onclick="stopTimer()" aria-label="정지"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
</div></div>

<script>
// ---------- 프로그램 정의 ----------
const V = {
  chest1:{t:'가슴운동 순서·형태 (공식)',u:'https://www.youtube.com/watch?v=tqkBiihQGIE'},
  chest2:{t:'가슴 그만해도? (with.황철순)',u:'https://www.youtube.com/watch?v=aqzs8H2zblU'},
  chest3:{t:'가슴운동 쇼츠',u:'https://www.youtube.com/shorts/MPkGDpEyUg0'},
  tri1:{t:'삼두 장두 EP.07',u:'https://www.youtube.com/watch?v=9fjECJoVcqE'},
  tri2:{t:'라잉 익스텐션 쇼츠',u:'https://www.youtube.com/shorts/hh0twkrbVdA'},
  back1:{t:'등운동 루틴 (공식)',u:'https://www.youtube.com/watch?v=-DC_9_E0evA'},
  back2:{t:'팔꿈치 방향·광배 EP.4',u:'https://www.youtube.com/watch?v=E7j79LjGn_g'},
  back3:{t:'등 가동범위 EP.8',u:'https://www.youtube.com/watch?v=WuCPa82C1Q8'},
  back4:{t:'뒤태 등운동 with 황철순',u:'https://www.youtube.com/watch?v=CzrSP23HwoA'},
  bi1:{t:'팔운동 단순하게 EP.6',u:'https://www.youtube.com/watch?v=izXfmlS7Iao'},
  sh1:{t:'어깨운동 완전판',u:'https://www.youtube.com/watch?v=ZUJNiQqlrCU'},
  sh2:{t:'사레레 황금비율',u:'https://www.youtube.com/watch?v=ijIFf-KJC-g'},
  sh3:{t:'정체기 어깨운동',u:'https://www.youtube.com/watch?v=vbqW-sutt20'},
  sh4:{t:'어깨 코칭 2026',u:'https://www.youtube.com/watch?v=4ajYkPdg5Co'},
  sh5:{t:'신과함께 어깨 EP.2',u:'https://www.youtube.com/watch?v=yBZm7JS6ZXQ'},
  leg1:{t:'하체·엉덩이 강의 (공식)',u:'https://www.youtube.com/watch?v=8BfVpiXxNmQ'},
  leg2:{t:'하체운동 with 황철순',u:'https://www.youtube.com/watch?v=eEdbL7CkwDw'},
  qa:{t:'Q&A 약점보완 EP.12',u:'https://www.youtube.com/watch?v=rKqvNNKN4w4'},
  pl:{t:'황철순 강의 플레이리스트',u:'https://www.youtube.com/playlist?list=PLlDqDqtO-8z7AK4FhDX4Hh9IjJBH5kg4t'},
};
// ---------- 자세 설명 ----------
const FORM = {
'인클라인 덤벨프레스':{
 set:'벤치 30~45°. 덤벨을 무릎 위에 올리고 뒤로 누우면서 가슴 옆으로 가져감. 견갑골 뒤로 모아 내리고 가슴은 위로 열기. 발은 바닥에 단단히.',

// ---------- 저장소 ----------
const KEY='wl_v1';
const store = JSON.parse(localStorage.getItem(KEY)||'{}');
store.logs = store.logs||{};     // {date: {day, ex:{name:{sets:[{w,r,d}],note}}}}
store.bw = store.bw||[];         // [{date,kg}]
store.start = store.start||null;
function save(){localStorage.setItem(KEY,JSON.stringify(store));renderWeek();}
function today(){const d=new Date();return d.toISOString().slice(0,10);}
let curDate = today();
let curTab = (()=>{const w=new Date().getDay();return ({1:'mon',2:'tue',4:'thu',5:'fri',6:'sat'})[w]||'mon';})();

// ---------- 주차 계산 ----------
function weekNo(){
  if(!store.start) return null;
  const diff=(new Date(curDate)-new Date(store.start))/864e5;
  return Math.floor(diff/7)+1;
}
function renderWeek(){
  const w=weekNo();const el=document.getElementById('weekBadge');
  if(!w){el.textContent='시작 전';el.className='badge';return;}
  const deload = w%7===0;
  el.textContent=(deload?'디로드 주 · ':'')+w+'주차';
  el.className='badge'+(deload?' deload':'');
}

// ---------- 지난 기록 찾기 ----------
function lastLog(dayId, exName){
  const dates=Object.keys(store.logs).filter(d=>d<curDate && store.logs[d].day===dayId && store.logs[d].ex[exName]).sort().reverse();
  if(!dates.length) return null;
  return {date:dates[0], ...store.logs[dates[0]].ex[exName]};
}
function fmtSets(sets){return sets.filter(s=>s.w!=null||s.r!=null).map(s=>`${s.w??'-'}×${s.r??'-'}`).join(', ')||'-';}
function progressionHint(ex, last){
  if(!last) return '';
  const done=last.sets.filter(s=>s.r!=null);
  if(!done.length) return '';
  const allTop=done.length>=ex.s && done.every(s=>s.r>=ex.r[1]);
  const anyBelow=done.some(s=>s.r<ex.r[0]);
  if(allTop) return `<span class="hint">↑ 전 세트 상한 달성 → 오늘 +2.5kg (덤벨 +2kg)</span>`;
  if(anyBelow) return `<span class="hint warn">↓ 하한 미달 세트 있음 → 같은 무게 유지 or -5%</span>`;
  return `<span class="hint keep">→ 같은 무게로 반복수 늘리기</span>`;
}

// ---------- 탭 ----------
const TABS=[...PROGRAM.map(d=>({id:d.id,label:d.short})),{id:'hist',label:'기록'},{id:'info',label:'가이드'}];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<div class="tab ${t.id===curTab?'active':''}" onclick="curTab='${t.id}';render()">${t.label}</div>`).join('');
}

// ---------- 운동일 화면 ----------
function getLog(dayId){
  if(!store.logs[curDate]) store.logs[curDate]={day:dayId,ex:{}};
  store.logs[curDate].day=dayId;
  return store.logs[curDate];
}
function renderDay(day){
  const log=store.logs[curDate]&&store.logs[curDate].day===day.id?store.logs[curDate]:{ex:{}};
  let totalSets=0,doneSets=0;
  // 아직 완료 안 된 첫 종목 = 지금 하는 운동 → 자세 설명 자동 펼침
  const currentIdx=day.ex.findIndex(ex=>{const e=log.ex[ex.n];if(!e)return true;let c=0;for(let k=0;k<ex.s;k++)if(e.sets[k]&&e.sets[k].d)c++;return c<ex.s;});
  const cards=day.ex.map((ex,i)=>{
    const isCurrent=i===currentIdx;
    const e=log.ex[ex.n]||{sets:[],note:''};
    const last=lastLog(day.id,ex.n);
    totalSets+=ex.s;
    const rows=[];
    for(let k=0;k<ex.s;k++){
      const s=e.sets[k]||{};
      if(s.d) doneSets++;
      const ph=last&&last.sets[k]?last.sets[k]:{};
      rows.push(`<tr class="${s.d?'row-done':''}">
        <td>${k+1}</td>
        <td><input type="number" class="ghost" inputmode="decimal" step="0.5" placeholder="${ph.w??''}" value="${s.w??''}" onchange="setVal('${day.id}','${esc(ex.n)}',${k},'w',this.value)"></td>
        <td><input type="number" class="ghost" inputmode="numeric" placeholder="${ph.r??''}" value="${s.r??''}" onchange="setVal('${day.id}','${esc(ex.n)}',${k},'r',this.value)"></td>
        <td><input type="checkbox" class="chk" ${s.d?'checked':''} onchange="setVal('${day.id}','${esc(ex.n)}',${k},'d',this.checked);if(this.checked)startTimer(${ex.rest})"></td>
      </tr>`);
    }
    return `<div class="card ${isCurrent?'current':''}" id="ex${i}">
      <h3><span>${ex.n}${isCurrent?' <span class="cur-badge">진행 중</span>':''}</span><span class="idx">${i+1}/${day.ex.length}</span></h3>
      <div class="target"><span>세트 <b>${ex.s}</b></span><span>반복 <b>${ex.r[0]===ex.r[1]?ex.r[0]:ex.r[0]+'~'+ex.r[1]}</b></span><span>RIR <b>${ex.rir}</b></span><span>휴식 <b>${ex.rest>=120?(ex.rest/60)+'분':ex.rest+'초'}</b></span></div>
      ${ex.note?`<div class="note">${ex.note}</div>`:''}
      ${renderForm(ex.n, isCurrent)}
      <div class="last">지난 기록${last?` (${last.date.slice(5)}): <b>${fmtSets(last.sets)}</b>`:': 없음'} ${progressionHint(ex,last)}</div>
      <table><tr><th>세트</th><th>무게(kg)</th><th>횟수</th><th>완료</th></tr>${rows.join('')}</table>
      <div class="videos">${ex.v.map(k=>`<a href="${V[k].u}" target="_blank" rel="noopener">${V[k].t}</a>`).join('')}</div>
      <details><summary>메모</summary><textarea placeholder="느낌, 통증, 다음에 바꿀 것..." onchange="setNote('${day.id}','${esc(ex.n)}',this.value)">${e.note||''}</textarea></details>
    </div>`;
  }).join('');
  const pct=totalSets?Math.round(doneSets/totalSets*100):0;
  return `<div class="day-title"><h2>${day.name}</h2><input type="date" class="date-in" value="${curDate}" onchange="curDate=this.value;render()"></div>
    <div class="card" style="padding:12px 16px"><div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500"><span>진행 ${doneSets}/${totalSets} 세트</span><span>${curDate===today()?'<span class="badge today">오늘</span>':''}</span></div><div class="prog"><div style="width:${pct}%"></div></div>
    ${!store.start?`<div class="rowbtns"><button class="btn primary" onclick="store.start=curDate;save();render()">이 날짜를 프로그램 시작일로</button></div>`:''}
    </div>
    ${cards}
    <div class="rowbtns"><button class="btn ok" onclick="finishDay('${day.id}')">오늘 운동 마무리</button><button class="btn danger small" onclick="if(confirm('${curDate} 기록을 삭제할까요?')){delete store.logs[curDate];save();render()}">기록 삭제</button></div>`;
}
function esc(s){return s.replace(/'/g,"\\'");}
function renderForm(name, open){
  const f=FORM[name]; if(!f) return '';
  return `<details class="form" ${open?'open':''}><summary>자세 설명</summary>
    <div class="fbox">
      <div class="frow"><b>준비</b><span>${f.set}</span></div>
      <div class="frow"><b>동작</b><span>${f.do}</span></div>
      <div class="frow bad"><b>실수</b><span>${f.no}</span></div>
      <div class="frow hcs"><b>황철순</b><span>${f.hcs}</span></div>
    </div></details>`;
}
function setVal(dayId,exName,k,f,v){
  const log=getLog(dayId);const e=log.ex[exName]=log.ex[exName]||{sets:[],note:''};
  e.sets[k]=e.sets[k]||{};
  if(f==='d') e.sets[k].d=v; else e.sets[k][f]=v===''?null:Number(v);
  if(!store.start) store.start=curDate;
  save();
  if(f==='d') render();
}
function setNote(dayId,exName,v){const log=getLog(dayId);const e=log.ex[exName]=log.ex[exName]||{sets:[],note:''};e.note=v;save();}
function finishDay(dayId){
  const log=getLog(dayId);
  // 빈 칸은 placeholder(지난 기록) 값으로 채움
  const day=PROGRAM.find(d=>d.id===dayId);
  day.ex.forEach(ex=>{
    const e=log.ex[ex.n]=log.ex[ex.n]||{sets:[],note:''};
    const last=lastLog(dayId,ex.n);
    for(let k=0;k<ex.s;k++){
      const s=e.sets[k]=e.sets[k]||{};
      if(s.d){ if(s.w==null&&last&&last.sets[k]) s.w=last.sets[k].w; if(s.r==null&&last&&last.sets[k]) s.r=last.sets[k].r; }
    }
  });
  if(!store.start) store.start=curDate;
  save();
  const kg=prompt('오늘 체중(kg)? 건너뛰려면 취소');
  if(kg){store.bw=store.bw.filter(b=>b.date!==curDate);store.bw.push({date:curDate,kg:Number(kg)});store.bw.sort((a,b)=>a.date<b.date?-1:1);save();}
  alert('저장 완료. 수고했어요.');
  curTab='hist';render();
}

// ---------- 기록 화면 ----------
function volume(log){let v=0;Object.values(log.ex).forEach(e=>e.sets.forEach(s=>{if(s.w&&s.r)v+=s.w*s.r;}));return v;}
function renderHist(){
  const dates=Object.keys(store.logs).sort().reverse();
  const bw=store.bw.slice(-8).map(b=>`<span class="badge sec">${b.date.slice(5)} ${b.kg}kg</span>`).join(' ');
  const bwDelta=store.bw.length>=2?(store.bw[store.bw.length-1].kg-store.bw[0].kg).toFixed(1):null;
  // 종목별 최고 기록
  const prs={};
  dates.forEach(d=>Object.entries(store.logs[d].ex).forEach(([n,e])=>e.sets.forEach(s=>{if(s.w&&s.r){const e1=s.w*(1+s.r/30);if(!prs[n]||e1>prs[n].e1)prs[n]={e1,w:s.w,r:s.r,d};}})));
  const prList=Object.entries(prs).sort((a,b)=>b[1].e1-a[1].e1).slice(0,12).map(([n,p])=>`<div class="kv"><span>${n}</span><span>${p.w}×${p.r} (e1RM ${Math.round(p.e1)}) · ${p.d.slice(5)}</span></div>`).join('');
  return `<div class="day-title"><h2>기록</h2></div>
  <div class="card"><h3>체중 ${bwDelta!=null?`<span class="badge ${bwDelta>0?'today':''}">${bwDelta>0?'+':''}${bwDelta}kg</span>`:''}</h3>
    <div class="stat">${bw||'<span class="muted">아직 없음. 운동 마무리 시 입력됩니다.</span>'}</div>
    <div class="rowbtns"><button class="btn small" onclick="const k=prompt('체중(kg)');if(k){store.bw=store.bw.filter(b=>b.date!==today());store.bw.push({date:today(),kg:Number(k)});store.bw.sort((a,b)=>a.date<b.date?-1:1);save();render();}">+ 체중 입력</button></div>
    <div class="muted" style="margin-top:6px">목표: 주 0.25~0.5kg 증가. 더 빠르면 지방 비율↑ → 칼로리 -200.</div></div>
  <div class="card"><h3>종목별 최고 (추정 1RM 순)</h3>${prList||'<span class="muted">아직 없음</span>'}</div>
  <div class="card"><h3>운동 일지 <span class="badge">${dates.length}회</span></h3>
    ${dates.length?dates.map(d=>{const l=store.logs[d];const day=PROGRAM.find(p=>p.id===l.day);return `<details class="hist"><summary><span class="d">${d}</span> <span class="v">${day?day.short:l.day} · 볼륨 ${Math.round(volume(l)).toLocaleString()}kg</span></summary>
      ${Object.entries(l.ex).map(([n,e])=>`<div class="ex">• ${n}: ${fmtSets(e.sets)}${e.note?` <i class="muted">— ${e.note}</i>`:''}</div>`).join('')}
      <div class="rowbtns"><button class="btn small" onclick="curDate='${d}';curTab='${l.day}';render()">열기</button></div></details>`;}).join(''):'<span class="muted">기록이 없습니다.</span>'}
  </div>
  <div class="card"><h3>백업</h3><div class="rowbtns">
    <button class="btn" onclick="exportJSON()">내보내기 (JSON)</button>
    <label class="btn">불러오기<input type="file" accept="application/json" style="display:none" onchange="importJSON(this.files[0])"></label>
    <button class="btn" onclick="const k=prompt('프로그램 시작일 (YYYY-MM-DD)',store.start||today());if(k){store.start=k;save();render();}">시작일 변경</button>
  </div><div class="muted" style="margin-top:6px">기록은 이 브라우저에만 저장됩니다. 기기 바꾸거나 브라우저 초기화 전에 내보내기 해두세요.</div></div>`;
}
function exportJSON(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(store,null,1));a.download=`workout-${today()}.json`;a.click();}
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.assign(store,o);save();render();alert('불러오기 완료');}catch(e){alert('파일 형식 오류');}};r.readAsText(f);}

// ---------- 원칙·식단 화면 ----------

// ---------- 테마 ----------
function applyTheme(){document.documentElement.setAttribute('data-theme',store.theme||'dark');}
function toggleTheme(){store.theme=(store.theme==='light')?'dark':'light';save();applyTheme();}
applyTheme();

// ---------- 타이머 ----------
let tInt=null,tLeft=0;
function startTimer(sec){
  stopTimer();tLeft=sec;tick();
  tInt=setInterval(()=>{tLeft--;tick();if(tLeft<=0){stopTimer();document.getElementById('timerText').classList.add('done');beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);
}
function stopTimer(){clearInterval(tInt);tInt=null;}
function tick(){const el=document.getElementById('timerText');el.classList.remove('done');el.textContent=Math.floor(tLeft/60)+':'+String(tLeft%60).padStart(2,'0');}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(()=>{o.stop();c.close();},350);}catch(e){}}

// ---------- 렌더 ----------
function render(){
  renderTabs();renderWeek();
  const m=document.getElementById('main');
  if(curTab==='hist') m.innerHTML=renderHist();
  else if(curTab==='info') m.innerHTML=renderInfo();
  else m.innerHTML=renderDay(PROGRAM.find(d=>d.id===curTab));
  window.scrollTo(0,0);
}
render();
</script>
